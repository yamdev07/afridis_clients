name: AFRIDIS CI Pipeline

on:
  push:
    branches: [backend, main]
  pull_request:
    branches: [backend]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - run: npm run lint --if-present

      - run: npm test --if-present


  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: my-react-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: my-react-app/package-lock.json

      - run: npm ci

      - run: npm run build


  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: |
          cd server
          npm audit --audit-level=high || true

      - run: |
          cd my-react-app
          npm audit --audit-level=high || true

  # Synchronise le dépôt miroir uniquement après merge sur main (source de vérité).
  # PAT : secrets MIRROR_PUSH_TOKEN ou mirror_repo_token (même valeur, deux noms acceptés).
  # défini dans Settings > Secrets du DÉPÔT OÙ CE WORKFLOW S’EXÉCUTE (souvent le repo du mainteneur).
  # Le GITHUB_TOKEN du repo courant ne peut pas pousser vers un autre repo → 403 si PAT absent / invalide.
  mirror:
    name: Mirror push to afridis_clients_2
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push main to mirror
        env:
          MIRROR_PUSH_TOKEN: ${{ secrets.MIRROR_PUSH_TOKEN }}
          MIRROR_REPO_TOKEN: ${{ secrets.mirror_repo_token }}
        run: |
          set -euo pipefail
          TOKEN="${MIRROR_PUSH_TOKEN:-}"
          if [ -z "$TOKEN" ]; then TOKEN="${MIRROR_REPO_TOKEN:-}"; fi
          if [ -z "$TOKEN" ]; then
            echo "::error::PAT manquant: définis le secret Actions MIRROR_PUSH_TOKEN ou mirror_repo_token (droits d'écriture sur afridis_clients_2)."
            exit 1
          fi
          git remote add mirror "https://x-access-token:${TOKEN}@github.com/SamuelSgn25/afridis_clients_2.git"
          # Le miroir doit refléter exactement ce main-ci (évite les rejets non-fast-forward).
          git push mirror "HEAD:refs/heads/main" --force
